# ============================================================================
# SCI Self-Certification — Impact Framework Manifest
# LoftStream Media Ltd — LoftStream Origin & Player v5.1.0
#
# Multi-region VoD platform: encoding + origin serving in AWS us-east-1
# (primary) and AWS eu-west-1 (Europe). Each region has its own grid
# carbon intensity. Network egress (origin → CDN edge) is included with
# region-weighted allocation. The CDN itself is excluded (third party).
#
# Run:  if-run --manifest loftstream-vod-v5.1.0-sci.yml
# ============================================================================

name: loftstream-vod-platform-sci
description: |
  SCI calculation for LoftStream Media Ltd's video-on-demand platform v5.1.0.

  An ad-supported video-on-demand service. The platform handles ingest,
  encoding (multi-bitrate ABR ladder), origin serving (HLS and DASH manifests
  and segments), and a metadata/catalog API. Content is delivered to viewers
  by a third-party CDN, which is excluded from this measurement.

  Infrastructure (AWS):
    us-east-1 (primary, ~60% of viewer traffic)
      - 4x c6i.8xlarge encoder workers (FFmpeg)
      - 2x c6i.4xlarge origin servers (NGINX)
      - 2x m6i.large metadata API (Node.js)
    eu-west-1 (~40% of viewer traffic)
      - 2x c6i.8xlarge encoder workers
      - 2x c6i.4xlarge origin servers
      - 1x m6i.large metadata API

  Network egress (origin to CDN edge): 250,000 GB allocated 60% US / 40% EU.

  Measurement period: April 2026 (30 days, 720 hours)
  Total viewer-hours: 220,000,000
  Carbon intensity (location-based):
    - us-east-1: 370 gCO2eq/kWh (EPA eGRID 2023, SRVC subregion)
    - eu-west-1: 290 gCO2eq/kWh (SEAI Ireland 2024)
  PUE: 1.135 (AWS published, both regions)

  Result: 3.31 gCO2eq per 1,000 viewer-hours

tags:
  kind: sci
  category: streaming-media
  domain: video-on-demand
  environment: production
  cloud_provider: aws
  approach: location-based
  multi-region: true

initialize:
  plugins:
    power-to-energy:
      method: Multiply
      path: builtin
      config:
        input-parameters: ["power-kw", "hours"]
        output-parameter: "energy-kwh"

    apply-pue:
      method: Multiply
      path: builtin
      config:
        input-parameters: ["energy-kwh", "pue"]
        output-parameter: "energy"

    operational-carbon:
      method: Multiply
      path: builtin
      config:
        input-parameters: ["energy", "grid/carbon-intensity"]
        output-parameter: "carbon-operational"

    time-share:
      method: Divide
      path: builtin
      config:
        numerator: time-reserved-hours
        denominator: expected-lifespan-hours
        output: time-share-ratio

    compute-embodied:
      method: Multiply
      path: builtin
      config:
        input-parameters: ["emissions-embodied-total", "time-share-ratio"]
        output-parameter: "carbon-embodied"

    sum-carbon:
      method: Sum
      path: builtin
      config:
        input-parameters:
          - carbon-operational
          - carbon-embodied
        output-parameter: carbon

    sci:
      method: Sci
      path: builtin
      config:
        functional-unit: "functional-unit-count"

tree:
  children:
    # ------------------------------------------------------------------
    # US (us-east-1)  |  PUE 1.135  |  CI 370 gCO2eq/kWh
    # ------------------------------------------------------------------

    us-encoder-1:
      pipeline:
        compute: [power-to-energy, apply-pue, operational-carbon, time-share, compute-embodied, sum-carbon]
      inputs:
        - timestamp: "2026-04-01T00:00:00.000Z"
          duration: 2592000
          power-kw: 0.150
          hours: 720
          pue: 1.135
          grid/carbon-intensity: 370
          emissions-embodied-total: 1400000
          time-reserved-hours: 720
          expected-lifespan-hours: 35040

