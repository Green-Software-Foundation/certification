# ============================================================================
# SCI Self-Certification — Impact Framework Manifest
# Meridian Bank Plc — Meridian Payments Platform v8.4.2
#
# Hybrid deployment: on-prem primary (London, UK) + AWS eu-west-2 DR site.
# Market-based carbon intensity is used (PPA-backed renewable purchasing for
# the on-prem site; AWS Customer Carbon Footprint market-based figure for DR).
# Each region uses its own grid/carbon-intensity at the child level.
# system-total provides pre-summed carbon-operational (different intensities
# across regions cannot be re-derived from a single intensity at the top).
#
# Run:  if-run --manifest meridianbank-payments-v8.4.2-sci.yml
# ============================================================================

name: meridianbank-payments-platform-sci
description: |
  SCI calculation for Meridian Bank's core Payments Platform v8.4.2.

  Hybrid deployment: primary site in Meridian's on-prem London data centre
  (Slough, UK) running the live workload; active-passive DR at AWS eu-west-2
  (London) running Kafka mirroring and RDS read replicas for failover.

  On-prem infrastructure:
    - 6x Dell PowerEdge R650 application servers
    - 2x Dell PowerEdge R750 Oracle database servers
    - 4x Dell PowerEdge R650 Kafka cluster nodes
    - 1x NetApp FAS9500 storage array

  AWS infrastructure:
    - 2x EC2 c6i.4xlarge (Kafka MirrorMaker)
    - 1x RDS db.r6i.2xlarge (read replica)

  Measurement period: March 2026 (31 days, 744 hours)
  Total transactions: 280,000,000
  Carbon intensity (market-based):
    - On-prem (London): 25 gCO2eq/kWh — 90% PPA-backed, 10% UK grid residual
    - AWS eu-west-2: 50 gCO2eq/kWh — AWS Customer Carbon Footprint, 2025
  PUE:
    - On-prem: 1.45 (measured 2025 facility average)
    - AWS eu-west-2: 1.135 (AWS published)

  Result: 17.85 gCO2eq per 10,000 transactions

tags:
  kind: sci
  category: financial-services
  domain: payments-processing
  environment: production
  deployment: hybrid
  approach: market-based

initialize:
  plugins:
    power-to-energy:
      method: Multiply
      path: builtin
      config:
        input-parameters: ["power-kw", "hours"]
        output-parameter: "energy-kwh"

    apply-pue:
      method: Multiply
      path: builtin
      config:
        input-parameters: ["energy-kwh", "pue"]
        output-parameter: "energy"

    operational-carbon:
      method: Multiply
      path: builtin
      config:
        input-parameters: ["energy", "grid/carbon-intensity"]
        output-parameter: "carbon-operational"

    time-share:
      method: Divide
      path: builtin
      config:
        numerator: time-reserved-hours
        denominator: expected-lifespan-hours
        output: time-share-ratio

    compute-embodied:
      method: Multiply
      path: builtin
      config:
        input-parameters: ["emissions-embodied-total", "time-share-ratio"]
        output-parameter: "carbon-embodied"

    sum-carbon:
      method: Sum
      path: builtin
      config:
        input-parameters:
          - carbon-operational
          - carbon-embodied
        output-parameter: carbon

    sci:
      method: Sci
      path: builtin
      config:
        functional-unit: "functional-unit-count"

tree:
  children:
    # ------------------------------------------------------------------
    # On-prem London site (primary, ~80% of workload)
    # PUE: 1.45  |  Market-based CI: 25 gCO2eq/kWh
    # 5-year hardware lifespan (banking refresh cycle)
    # ------------------------------------------------------------------

    onprem-app-server-1:
      pipeline:
        compute:
          - power-to-energy
          - apply-pue
          - operational-carbon
          - time-share
          - compute-embodied
          - sum-carbon
      inputs:
        - timestamp: "2026-03-01T00:00:00.000Z"
          duration: 2678400
          power-kw: 0.250
          hours: 744
          pue: 1.45
          grid/carbon-intensity: 25
          emissions-embodied-total: 1500000
          time-reserved-hours: 744
          expected-lifespan-hours: 43800   # 5 years

    onprem-app-server-2:
      pipeline:
        compute: [power-to-energy, apply-pue, operational-carbon, time-share, compute-embodied, sum-carbon]
