    # ------------------------------------------------------------------
    # System total: aggregates the per-component values and computes
    # the SCI score reported on the certificate.
    #
    # Inputs are pre-summed:
    #   energy = 1977.696 kWh (all components × PUE)
    #   carbon-embodied = 272,328.77 gCO2eq (all components allocated)
    #   functional-unit-count = 23,200 (23.2 billion tokens / 1,000,000)
    # ------------------------------------------------------------------

    system-total:
      pipeline:
        compute:
          - operational-carbon
          - sum-carbon
          - sci
      inputs:
        - timestamp: "2026-02-01T00:00:00.000Z"
          duration: 2419200
          energy: 1977.696                     # total E after PUE (kWh)
          grid/carbon-intensity: 420           # gCO2eq/kWh
          carbon-embodied: 272328.7671232876   # total M (gCO2eq)
          functional-unit-count: 23200         # tokens (millions)
