    # ------------------------------------------------------------------
    # System total: aggregates the per-component values and computes
    # the SCI score reported on the certificate.
    #
    # Inputs are pre-summed (operational across two regions with different
    # market-based intensities cannot be re-derived from a single intensity):
    #   carbon-operational = 96,859.50 gCO2eq (3,452.16 × 25 + 211.11 × 50)
    #   carbon-embodied    = 403,000 gCO2eq (sum of per-component allocations)
    #   functional-unit-count = 28,000 (280,000,000 transactions / 10,000)
    # ------------------------------------------------------------------

    system-total:
      pipeline:
        compute:
          - sum-carbon
          - sci
      inputs:
        - timestamp: "2026-03-01T00:00:00.000Z"
          duration: 2678400
          carbon-operational: 96859.50
          carbon-embodied: 403000.00
          functional-unit-count: 28000
